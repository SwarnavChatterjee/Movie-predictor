<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movie Recommender</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #fff;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 30px;
      text-align: center;
      border-bottom: 2px solid #e94560;
    }

    header h1 { font-size: 2.5rem; color: #e94560; }
    header p  { color: #aaa; margin-top: 8px; }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 30px 20px 0;
    }

    .tab {
      padding: 10px 28px;
      border-radius: 30px;
      border: 2px solid #e94560;
      background: transparent;
      color: #e94560;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: #e94560;
      color: #fff;
    }

    .search-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 30px 20px;
    }

    input, select {
      padding: 14px 20px;
      font-size: 1rem;
      border-radius: 8px;
      border: 2px solid #e94560;
      background: #1a1a2e;
      color: #fff;
      width: 280px;
      outline: none;
    }

    select option { background: #1a1a2e; }

    button.go-btn {
      padding: 14px 28px;
      font-size: 1rem;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.go-btn:hover { background: #c73652; }

    #error {
      text-align: center;
      color: #e94560;
      margin-top: -10px;
      margin-bottom: 10px;
    }

    #results-title {
      text-align: center;
      font-size: 1.3rem;
      color: #aaa;
      margin-bottom: 24px;
    }

    #results-title span { color: #e94560; font-weight: bold; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 0 40px 60px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #2a2a4a;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #e94560;
    }

    .rank {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #e94560;
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .card h3 {
      font-size: 1rem;
      margin-bottom: 10px;
      padding-right: 50px;
      line-height: 1.4;
    }

    .genres {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .genre-tag {
      background: #0f3460;
      color: #7eb8f7;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .rating-bar-container { margin-top: 10px; }

    .rating-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
    }

    .rating-bar {
      height: 6px;
      background: #2a2a4a;
      border-radius: 4px;
      overflow: hidden;
    }

    .rating-fill {
      height: 100%;
      background: linear-gradient(90deg, #e94560, #f5a623);
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    .num-ratings {
      font-size: 0.75rem;
      color: #666;
      margin-top: 6px;
    }

    .loader {
      text-align: center;
      padding: 60px;
      color: #aaa;
      font-size: 1.1rem;
    }

    .loader span {
      display: inline-block;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🎬 Movie Recommender</h1>
    <p>Powered by SVD Matrix Factorization · MovieLens 1M</p>
  </header>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('user')">👤 By User</button>
    <button class="tab" onclick="switchTab('genre')">🎭 By Genre</button>
  </div>

  <!-- User Search -->
  <div class="search-container" id="user-search">
    <input type="number" id="userInput" placeholder="Enter User ID (1–6040)" min="1" max="6040" />
    <button class="go-btn" onclick="getByUser()">Recommend</button>
  </div>

  <!-- Genre Search -->
  <div class="search-container" id="genre-search" style="display:none;">
    <select id="genreInput">
      <option value="">Select a genre...</option>
    </select>
    <button class="go-btn" onclick="getByGenre()">Recommend</button>
  </div>

  <div id="error"></div>
  <div id="results-title"></div>
  <div class="grid" id="results"></div>

  <script>
    let currentTab = 'user'

    // Load genres on page load
    async function loadGenres() {
      const res = await fetch('http://127.0.0.1:8000/genres')
      const data = await res.json()
      const select = document.getElementById('genreInput')
      data.genres.forEach(g => {
        const opt = document.createElement('option')
        opt.value = g
        opt.textContent = g
        select.appendChild(opt)
      })
    }

    loadGenres()

    function switchTab(tab) {
      currentTab = tab
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
      event.target.classList.add('active')

      document.getElementById('user-search').style.display = tab === 'user' ? 'flex' : 'none'
      document.getElementById('genre-search').style.display = tab === 'genre' ? 'flex' : 'none'

      document.getElementById('results').innerHTML = ''
      document.getElementById('results-title').textContent = ''
      document.getElementById('error').textContent = ''
    }

    async function getByUser() {
      const userId = document.getElementById('userInput').value.trim()
      const errorDiv = document.getElementById('error')
      errorDiv.textContent = ''

      if (!userId || userId < 1 || userId > 6040) {
        errorDiv.textContent = 'Please enter a valid User ID between 1 and 6040.'
        return
      }

      showLoader()

      try {
        const res = await fetch(`http://127.0.0.1:8000/recommend/${userId}?n=10`)
        const data = await res.json()

        if (data.error) { errorDiv.textContent = data.error; clearResults(); return }

        document.getElementById('results-title').innerHTML =
          `Top 10 recommendations for <span>User ${userId}</span>`

        renderCards(data.recommendations.map(m => ({
          ...m,
          rating: m.predicted_rating,
          label: 'Predicted Rating'
        })))

      } catch { errorDiv.textContent = 'Could not connect to API. Make sure uvicorn is running.' }
    }

    async function getByGenre() {
      const genre = document.getElementById('genreInput').value
      const errorDiv = document.getElementById('error')
      errorDiv.textContent = ''

      if (!genre) { errorDiv.textContent = 'Please select a genre.'; return }

      showLoader()

      try {
        const res = await fetch(`http://127.0.0.1:8000/recommend/genre/${genre}?n=10`)
        const data = await res.json()

        if (data.error) { errorDiv.textContent = data.error; clearResults(); return }

        document.getElementById('results-title').innerHTML =
          `Top 10 <span>${genre}</span> movies`

        renderCards(data.movies.map(m => ({
          ...m,
          rating: m.avg_rating,
          label: 'Avg Rating'
        })))

      } catch { errorDiv.textContent = 'Could not connect to API. Make sure uvicorn is running.' }
    }

    function renderCards(movies) {
      const resultsDiv = document.getElementById('results')
      resultsDiv.innerHTML = ''

      movies.forEach((movie, index) => {
        const genres = movie.genres.split('|').map(g =>
          `<span class="genre-tag">${g}</span>`).join('')
        const fillPercent = ((movie.rating - 1) / 4) * 100
        const numRatings = movie.num_ratings
          ? `<div class="num-ratings">${movie.num_ratings.toLocaleString()} ratings</div>` : ''

        resultsDiv.innerHTML += `
          <div class="card">
            <span class="rank">#${index + 1}</span>
            <h3>${movie.title}</h3>
            <div class="genres">${genres}</div>
            <div class="rating-bar-container">
              <div class="rating-label">
                <span>${movie.label}</span>
                <span>${movie.rating} / 5</span>
              </div>
              <div class="rating-bar">
                <div class="rating-fill" style="width: ${fillPercent}%"></div>
              </div>
              ${numRatings}
            </div>
          </div>`
      })
    }

    function showLoader() {
      document.getElementById('results').innerHTML =
        '<div class="loader"><span>Finding recommendations...</span></div>'
      document.getElementById('results-title').textContent = ''
    }

    function clearResults() {
      document.getElementById('results').innerHTML = ''
    }

    document.getElementById('userInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') getByUser()
    })
  </script>

</body>
</html>
